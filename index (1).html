<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quantum</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F8FC;--card:#FFFFFF;--glass:rgba(255,255,255,.86);--ink:#14131F;--mute:#6C6A80;--line:#E6E5F0;--soft:#EFEEF7;--blue:#2F6BFF;--sh:rgba(40,30,90,.14);color-scheme:light;background:var(--bg)}
@media (prefers-color-scheme:dark){:root{--bg:#0D0C14;--card:#1A1925;--glass:rgba(26,25,37,.86);--ink:#F3F2FB;--mute:#9C9AB2;--line:#2B2A3A;--soft:#272536;--sh:rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 Manrope,system-ui,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:is(button,textarea):focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
.top{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 14px;background:linear-gradient(var(--bg) 55%,transparent)}
.pill{height:48px;min-width:48px;border-radius:24px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 2px 14px var(--sh);display:flex;align-items:center;justify-content:center;padding:0 2px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.ib:hover{background:var(--soft)}
.top h1{flex:1;margin:0;font-size:17px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scr{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 80px) 16px 16px}
#hello{margin:auto;position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;padding-bottom:36px}
.glow{position:absolute;top:-70px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(155,61,255,.30),rgba(255,140,30,.16) 55%,transparent 72%);filter:blur(12px);z-index:-1}
.logo{width:96px;height:96px;border-radius:28px;object-fit:cover;box-shadow:0 12px 42px rgba(155,61,255,.38),0 4px 16px rgba(255,140,30,.28);animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-7px)}}
#hello h2{margin:0;max-width:260px;font-size:21px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.gt{background:linear-gradient(110deg,#9B3DFF,#FF4FA0 55%,#FF9A1F);-webkit-background-clip:text;background-clip:text;color:transparent}
.u{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin:12px 0}
.ub{max-width:84%;background:var(--soft);padding:10px 16px;border-radius:22px 22px 6px 22px;white-space:pre-wrap;overflow-wrap:anywhere}
.ua{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ua img{width:84px;height:84px;object-fit:cover;border-radius:14px}
.ua span{background:var(--soft);border-radius:12px;padding:4px 10px;font-size:13px;color:var(--mute)}
.b{margin:12px 0}.b p{margin:0 0 8px}
.acts{display:flex;gap:2px;color:var(--mute)}
.acts .ib{width:40px;height:40px}.acts .ib.on{color:var(--blue)}
.bot{padding:0 12px calc(env(safe-area-inset-bottom,0px) + 8px)}
.cw{position:relative}
.comp{background:var(--card);border-radius:30px;border:1px solid var(--line);box-shadow:0 6px 28px var(--sh);padding:14px 14px 10px}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}
.th{position:relative;flex:none;width:76px;height:76px;border-radius:16px;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--mute)}
.th img{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center}
.th svg.i{width:14px;height:14px;stroke-width:2.6}
#inp{display:block;width:100%;border:0;outline:0;resize:none;background:none;color:var(--ink);font:inherit;max-height:150px;padding:4px 4px 8px}
#inp::placeholder{color:var(--mute)}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.model{display:flex;align-items:center;gap:6px;height:44px;padding:0 12px 0 16px;border-radius:22px;background:var(--soft);min-width:0;max-width:56%;white-space:nowrap;font-size:15px}
.model b{font-weight:800}.model small{font-size:14px;color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.model svg.i{width:18px;height:18px}
.send{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;transition:opacity .2s}
.send.off{opacity:.35}
.note{margin:8px 0 0;text-align:center;font-size:12px;color:var(--mute)}
#veil{position:absolute;inset:0;z-index:15;background:rgba(10,8,22,.3)}
.pop{position:absolute;z-index:20;bottom:calc(100% + 8px);left:0;width:min(86%,330px);background:var(--card);border-radius:28px;padding:8px;box-shadow:0 10px 44px var(--sh);border:1px solid var(--line)}
.pop.mdp{left:22%;width:min(78%,300px)}
.it{display:flex;align-items:center;gap:16px;width:100%;padding:8px 10px;border-radius:20px;text-align:left;font-weight:600;font-size:18px}
.it:hover{background:var(--soft)}
.it .c{width:52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.it:hover .c{background:var(--card)}
.it small{display:block;font-size:13px;font-weight:400;color:var(--mute);line-height:1.3}
.it .ck{margin-left:auto;color:var(--blue)}
#drawer{position:absolute;z-index:30;top:0;bottom:0;left:0;width:min(86%,340px);background:var(--card);display:flex;flex-direction:column;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-105%);transition:transform .26s ease;box-shadow:8px 0 40px var(--sh)}
#drawer.open{transform:none}
.dh{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}
.dh img{width:40px;height:40px;border-radius:12px}.dh span{flex:1}
.nc{display:flex;align-items:center;gap:12px;height:50px;padding:0 16px;border-radius:25px;color:#fff;font-weight:800;background:linear-gradient(110deg,#8A3FFC,#FF4FA0 60%,#FF8A1F)}
.sr{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:23px;background:var(--soft);color:var(--mute);font-size:15px}
.dl{flex:1;overflow-y:auto}
.dl h4{margin:14px 10px 6px;font-size:13px;font-weight:600;color:var(--mute)}
.dl button{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:14px;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl button:hover,.dl button.a{background:var(--soft)}
.me{display:flex;align-items:center;gap:12px;padding-top:12px;border-top:1px solid var(--line);font-weight:800}
.me i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;background:linear-gradient(135deg,#8A3FFC,#FF8A1F)}
.me span{flex:1}
#toast{position:absolute;z-index:40;left:50%;bottom:140px;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.logo{animation:none}#drawer,#toast,.send{transition:none}}
/* nicer buttons */
.pill{box-shadow:0 4px 18px var(--sh),inset 0 0 0 1px var(--line)}
.ib,.model,.send,.nc{transition:background .18s,transform .12s,box-shadow .18s,opacity .2s}
.ib:active,.model:active,.send:active,.nc:active{transform:scale(.93)}
#plus,#mic{background:var(--soft)}
#plus:hover,#mic:hover{background:var(--line)}
.model{background:linear-gradient(180deg,var(--card),var(--soft));box-shadow:inset 0 0 0 1px var(--line),0 1px 3px var(--sh)}
.model:hover{box-shadow:inset 0 0 0 1px var(--blue),0 2px 8px var(--sh)}
.send{background:linear-gradient(135deg,#5B8CFF,#2F5BFF);box-shadow:0 6px 16px rgba(47,107,255,.42)}
.send.off{box-shadow:none}
.nc{box-shadow:0 8px 22px rgba(155,61,255,.35)}
.it .c{background:linear-gradient(135deg,var(--soft),var(--line))}
.th button{box-shadow:0 2px 6px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){.ib,.model,.send,.nc{transition:none}.ib:active,.model:active,.send:active,.nc:active{transform:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="pill"><button class="ib" id="menu" data-ic="menu" aria-label="Меню"></button></div>
    <h1 id="ttl"></h1>
    <div class="pill"><button class="ib" id="new" data-ic="edit" aria-label="Новый чат"></button><button class="ib" id="more" data-ic="dots" aria-label="Ещё"></button></div>
  </header>

  <main id="scr">
    <section id="hello">
      <div class="glow"></div>
      <img class="logo" data-logo alt="Логотип Quantum">
      <h2><span class="gt">Привет,</span> давайте начнём общение</h2>
    </section>
    <div id="msgs"></div>
  </main>

  <footer class="bot">
    <div class="cw">
      <div class="pop" id="mp" hidden></div>
      <div class="pop mdp" id="mdp" hidden></div>
      <div class="comp">
        <div class="strip" id="strip" hidden></div>
        <textarea id="inp" rows="1" placeholder="Спросите Quantum…" aria-label="Сообщение"></textarea>
        <div class="row">
          <button class="ib" id="plus" data-ic="plus" aria-label="Добавить"></button>
          <button class="model" id="mdl" type="button"><b id="mn">Quantum Flash</b><small id="ms">Быстрый</small><span data-ic="chev"></span></button>
          <span class="sp"></span>
          <button class="ib" id="mic" data-ic="mic" aria-label="Голосовой ввод"></button>
          <button class="send off" id="send" data-ic="up" aria-label="Отправить"></button>
        </div>
      </div>
    </div>
    <p class="note">Quantum может ошибаться. Проверяйте важную информацию.</p>
  </footer>

  <div id="veil" hidden></div>
  <aside id="drawer" aria-label="Боковая панель">
    <div class="dh"><img data-logo alt=""><span>Quantum</span><button class="ib" id="dx" data-ic="x" aria-label="Закрыть"></button></div>
    <button class="nc" id="nc2"><span data-ic="edit"></span>Новый чат</button>
    <div class="sr"><span data-ic="search"></span>Поиск по чатам</div>
    <div class="dl">
      <h4>Сегодня</h4><button class="a">Идея для игры</button><button>Помощь с математикой</button>
      <h4>Вчера</h4><button>План на выходные</button><button>Рецепт блинов</button>
      <h4>Прошлые 7 дней</h4><button>Как работает Wi-Fi</button><button>Названия для канала</button>
    </div>
    <div class="me"><i>В</i><span>Вы</span><button class="ib" data-ic="dots" aria-label="Настройки"></button></div>
  </aside>
  <div id="toast" role="status"></div>
</div>
<input type="file" id="file" hidden multiple>

var MI = [['cam', 'Камера'], ['img', 'Фото'], ['clip', 'Файлы'], ['plug', 'Плагины'], ['gauge', 'Размышлять глубже']];
$('mp').innerHTML = MI.map(function (m) { return '<button class="it" data-k="' + m[0] + '"><span class="c">' + ic(m[0]) + '</span><span>' + m[1] + '</span></button>'; }).join('');
var MD = [['Quantum Flash', 'Быстрый'], ['Quantum Pro', 'Умный'], ['Quantum Max', 'Самый мощный']];
function drawModels() {
  $('mdp').innerHTML = MD.map(function (m, i) { return '<button class="it" data-m="' + i + '"><span><b>' + m[0] + '</b><small>' + m[1] + '</small></span>' + (i === cur ? '<span class="ck">' + ic('check') + '</span>' : '') + '</button>'; }).join('');
}
drawModels();

$('plus').onclick = function () { openPop('mp'); };
$('mdl').onclick = function () { openPop('mdp'); };
$('veil').onclick = closeAll;
$('menu').onclick = function () { closeAll(); $('veil').hidden = false; $('drawer').classList.add('open'); };
$('dx').onclick = closeAll;
$('more').onclick = function () { toast('Макет: меню пока не работает'); };
$('mic').onclick = function () { toast('Макет: голосовой ввод пока не работает'); };

$('mp').onclick = function (e) {
  var b = e.target.closest('.it'); if (!b) return; var k = b.dataset.k; closeAll();
  if (k === 'plug') toast('Плагины скоро появятся');
  else if (k === 'gauge') { deep = !deep; toast(deep ? 'Глубокое размышление включено' : 'Глубокое размышление выключено'); }
  else { var f = $('file'); f.accept = k === 'clip' ? '' : 'image/*'; if (k === 'cam') f.setAttribute('capture', 'environment'); else f.removeAttribute('capture'); f.click(); }
};
$('mdp').onclick = function (e) {
  var b = e.target.closest('.it'); if (!b) return; cur = +b.dataset.m;
  $('mn').textContent = MD[cur][0]; $('ms').textContent = MD[cur][1]; drawModels(); closeAll();
};

function upd() { $('send').classList.toggle('off', !inp.value.trim() && !atts.length); }
function grow() { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 150) + 'px'; }
function strip() {
  var s = $('strip'); s.hidden = !atts.length;
  s.innerHTML = atts.map(function (a, i) {
    return '<div class="th">' + (a.img ? '<img src="' + a.img + '" alt="">' : '<span>' + esc(a.n.split('.').pop().slice(0, 4).toUpperCase()) + '</span>') + '<button type="button" data-x="' + i + '" aria-label="Убрать">' + ic('x') + '</button></div>';
  }).join('');
  upd();
}
$('strip').onclick = function (e) { var b = e.target.closest('[data-x]'); if (b) { atts.splice(+b.dataset.x, 1); strip(); } };
$('file').onchange = function () {
  Array.prototype.forEach.call(this.files, function (f) {
    if (/^image\//.test(f.type)) { var r = new FileReader(); r.onload = function () { atts.push({ n: f.name, img: r.result }); strip(); }; r.readAsDataURL(f); }
    else { atts.push({ n: f.name }); strip(); }
  });
  this.value = '';
};
inp.addEventListener('input', function () { grow(); upd(); });
inp.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches) { e.preventDefault(); send(); } });
$('send').onclick = send;

function send() {
  var t = inp.value.trim(); if (!t && !atts.length) return;
  if (!started) { started = true; $('hello').hidden = true; $('ttl').textContent = (t || 'Вложение').slice(0, 24) + (t.length > 24 ? '…' : ''); }
  var h = '<div class="u">' + (atts.length ? '<div class="ua">' + atts.map(function (a) { return a.img ? '<img src="' + a.img + '" alt="">' : '<span>' + esc(a.n) + '</span>'; }).join('') + '</div>' : '') + (t ? '<div class="ub">' + esc(t) + '</div>' : '') + '</div>';
  $('msgs').insertAdjacentHTML('beforeend', h);
  atts = []; inp.value = ''; grow(); strip(); scr.scrollTop = scr.scrollHeight;
  setTimeout(function () {
    var acts = ['copy', 'up2', 'down2', 'say', 'share', 'dots'].map(function (n) { return '<button class="ib" data-a="' + n + '" aria-label="' + n + '">' + ic(n) + '</button>'; }).join('');
    $('msgs').insertAdjacentHTML('beforeend', '<div class="b"><p>Это красивая оболочка Quantum: интерфейс уже готов, а ИИ пока не подключён. Когда подключим, ответы будут появляться здесь.</p><div class="acts">' + acts + '</div></div>');
    scr.scrollTop = scr.scrollHeight;
  }, 600);
}
$('msgs').onclick = function (e) {
  var b = e.target.closest('[data-a]'); if (!b) return; var a = b.dataset.a;
  if (a === 'up2' || a === 'down2') b.classList.toggle('on');
  else if (a === 'copy') { try { navigator.clipboard.writeText(b.closest('.b').querySelector('p').textContent); toast('Скопировано'); } catch (x) { toast('Не удалось скопировать'); } }
  else toast('Макет: кнопка пока не работает');
};
function fresh() { started = false; $('hello').hidden = false; $('msgs').innerHTML = ''; $('ttl').textContent = ''; atts = []; strip(); closeAll(); }
$('new').onclick = fresh; $('nc2').onclick = fresh;
document.querySelector('.dl').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; this.querySelectorAll('button').forEach(function (x) { x.classList.remove('a'); }); b.classList.add('a'); closeAll(); };
})();
</script>
</body>
</html>
