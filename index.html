<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101020">
<title>Quantum AI</title>
<style>
:root{color-scheme:light;--bg:#fff;--text:#171717;--muted:#8b8b8b;--line:#e9e9e9;--blue:#3867e8;--soft:#f3f4f6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100dvh;display:flex;flex-direction:column}
header{height:62px;flex:0 0 62px;display:flex;align-items:center;padding:0 16px;gap:12px;background:#fff;position:sticky;top:0;z-index:5}
.headbtn{width:42px;height:42px;border:0;border-radius:50%;background:transparent;color:#171717;font-size:25px;display:grid;place-items:center;cursor:pointer}
.headbtn:active{background:#f1f1f1}
.headspacer{flex:1}
.logo,.brand,.sub,#status{display:none}
main{width:100%;max-width:820px;margin:0 auto;flex:1;display:flex;flex-direction:column;padding:0 16px 8px;min-height:calc(100dvh - 62px)}
#welcome{margin:auto auto 26px;text-align:center;padding:20px 8px;display:flex;flex-direction:column;align-items:center;gap:16px}
.welcome-logo{width:42px;height:42px;object-fit:contain;border-radius:50%;display:none}
#welcome .big{font-size:26px;font-weight:600;letter-spacing:-.6px;color:#222}
#welcome p{display:none}
#chat{display:flex;flex-direction:column;gap:22px;padding:16px 0 26px;overflow-y:auto}
.msg{max-width:100%;padding:0;border:0;border-radius:0;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;background:transparent}
.user{align-self:flex-end;background:#f4f4f4;border-radius:22px;padding:11px 16px;max-width:88%}
.assistant{align-self:stretch;background:transparent;padding:2px 4px}
.msg small{display:none}
#composer{position:sticky;bottom:0;padding:10px 0 max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#fff 16%)}
.composebox{display:flex;flex-direction:column;gap:8px;padding:12px 13px 10px;background:#fff;border:1px solid #e5e5e5;border-radius:28px;box-shadow:0 2px 10px #0000000a}
.inputrow{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;min-height:42px;max-height:150px;border:0;outline:0;background:transparent;color:var(--text);font:16px/1.45 inherit;padding:9px 5px}
textarea::placeholder{color:#8f8f8f}
#send{border:0;border-radius:50%;width:42px;height:42px;flex:0 0 42px;background:var(--blue);color:white;font-size:23px;font-weight:600;display:grid;place-items:center}
#send:disabled{opacity:.45}
.toolrow{display:flex;align-items:center;gap:8px;min-height:40px}
.chip{border:0;background:#f2f2f2;color:#333;border-radius:22px;padding:9px 13px;font-size:13px;white-space:nowrap}
.chip.active{background:#e5ebff;color:#315bc2}
.circlebtn{border:0;background:transparent;color:#222;border-radius:50%;width:40px;height:40px;flex:0 0 40px;font-size:25px;line-height:1;display:grid;place-items:center}
.toolspacer{flex:1}
#clear{display:none}
#error{color:#c33;text-align:center;font-size:13px;padding:4px}
.tools{display:none}
@media(max-width:520px){main{padding:0 14px 8px}.user{max-width:90%}.composebox{border-radius:27px;padding:11px 12px 9px}.toolrow{gap:5px}.chip{font-size:12px;padding:8px 11px}}
</style>
</head>
<body>
<header>
<button class="headbtn" id="menuBtn" aria-label="Меню">☰</button>
<div class="headspacer"></div>
<button class="headbtn" id="newBtn" aria-label="Новый чат">✎</button>
<button class="headbtn" id="soundBtn" aria-label="Дополнительно">⋮</button>
</header>
<main>
<section id="welcome"><div class="big">Привет! Чем могу помочь?</div><p></p></section>
<section id="chat" aria-live="polite"></section>
<div id="error"></div>
<div id="composer"><div class="composebox">
<div class="inputrow">
<button class="circlebtn" id="attachBtn" aria-label="Добавить">＋</button>
<textarea id="prompt" rows="1" placeholder="Спросите что угодно"></textarea>
<button class="circlebtn" id="voiceBtn" aria-label="Голосовой ввод">🎙</button>
<button id="send" aria-label="Отправить">↑</button>
</div>
<div class="toolrow">
<button class="chip" id="reasonBtn">◉ Рассуждение</button>
<button class="chip" id="searchBtn">◎ Поиск</button>
<div class="toolspacer"></div>
</div>
</div><div class="tools"><button id="clear">Очистить чат</button></div></div></main>
<script>
const chatEl=document.querySelector('#chat'),promptEl=document.querySelector('#prompt'),sendBtn=document.querySelector('#send'),errorEl=document.querySelector('#error'),welcome=document.querySelector('#welcome'),statusEl=document.querySelector('#status');
let messages=JSON.parse(localStorage.getItem('quantum_messages')||'[]'),controller=null;
function save(){localStorage.setItem('quantum_messages',JSON.stringify(messages))}
function render(){chatEl.innerHTML='';welcome.style.display=messages.length?'none':'block';for(const m of messages){const d=document.createElement('div');d.className='msg '+(m.role==='user'?'user':'assistant');const s=document.createElement('small');s.textContent=m.role==='user'?'Ты':'Quantum';d.append(s,document.createTextNode(m.content));chatEl.append(d)}window.scrollTo(0,document.body.scrollHeight)}
function add(role,content){messages.push({role,content});save();render()}
async function send(){const text=promptEl.value.trim();if(!text||sendBtn.disabled)return;errorEl.textContent='';add('user',text);promptEl.value='';sendBtn.disabled=true;sendBtn.textContent='…';controller=new AbortController();const waiting={role:'assistant',content:'Думаю…'};const temp=document.createElement('div');temp.className='msg assistant';temp.textContent='Quantum печатает…';chatEl.append(temp);
try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:messages.slice(-30)}),signal:controller.signal});const data=await r.json();if(!r.ok)throw new Error(data.error||'Ошибка сервера');add('assistant',data.reply||'Модель вернула пустой ответ.');}
catch(e){if(e.name!=='AbortError')errorEl.textContent=e.message||'Не удалось отправить сообщение.';temp.remove();}
finally{temp.remove();sendBtn.disabled=false;sendBtn.textContent='➤';controller=null;promptEl.focus()}}
sendBtn.addEventListener('click',send);
document.querySelector('#newBtn').addEventListener('click',()=>{messages=[];save();render();errorEl.textContent='';promptEl.focus()});
document.querySelector('#menuBtn').addEventListener('click',()=>{alert('История чатов появится в следующем обновлении Quantum.')});
document.querySelector('#soundBtn').addEventListener('click',()=>{alert('Дополнительные настройки Quantum появятся позже.')});
document.querySelector('#reasonBtn').addEventListener('click',e=>e.currentTarget.classList.toggle('active'));
document.querySelector('#searchBtn').addEventListener('click',()=>{errorEl.textContent='Поиск пока не подключён.'});
document.querySelector('#attachBtn').addEventListener('click',()=>{errorEl.textContent='Загрузка файлов пока не поддерживается.'});
document.querySelector('#voiceBtn').addEventListener('click',()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){errorEl.textContent='Голосовой ввод не поддерживается этим браузером.';return;}const rec=new SR();rec.lang='ru-RU';rec.onresult=e=>{promptEl.value+=(promptEl.value?' ':'')+e.results[0][0].transcript};rec.onerror=()=>{errorEl.textContent='Не удалось распознать речь.'};rec.start()});promptEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});document.querySelector('#clear').addEventListener('click',()=>{messages=[];save();render();errorEl.textContent=''});render();
</script>
</body>
</html>
