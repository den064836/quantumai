<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Quantum</title>
<link rel="icon">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font:16px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f8f7fd;color:#14121f}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:22px;height:22px;flex:none}
#app{height:100dvh;display:flex;flex-direction:column;max-width:820px;margin:auto;position:relative;overflow:hidden}
.top{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;padding:14px 12px;z-index:5;pointer-events:none}
.rb{height:44px;border-radius:22px;background:#fff;box-shadow:0 4px 18px rgba(80,60,140,.12);display:flex;pointer-events:auto}
.rb button{height:44px;min-width:44px;display:grid;place-items:center}
main{flex:1;min-height:0;display:flex;flex-direction:column}
#wl{margin:auto;text-align:center;padding:0 24px 60px}
.lg{width:88px;height:88px;border-radius:24px;box-shadow:0 0 70px rgba(168,85,247,.3);display:block;margin:0 auto 22px}
h1{font-size:28px;line-height:1.25;font-weight:800}
h1 span{background:linear-gradient(90deg,#a63cef,#ff4fa0 60%,#ff8a2a);-webkit-background-clip:text;background-clip:text;color:transparent}
#msgs{display:none;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;overflow-anchor:none;flex-direction:column;gap:14px;padding:76px 16px 12px;-webkit-overflow-scrolling:touch}
.has #msgs{display:flex}.has #wl{display:none}
.m{max-width:92%;white-space:pre-wrap;word-break:break-word;line-height:1.55}
.u{align-self:flex-end;background:#ebe8f8;border-radius:20px 20px 6px 20px;padding:10px 15px}
.a{align-self:flex-start}
.a pre{background:#14121f;color:#eee;padding:12px;border-radius:14px;overflow:auto;font-size:13.5px;margin:8px 0}
.a code{background:#ebe8f8;border-radius:6px;padding:1px 5px;font-size:.92em}

.a{font-size:16px}
.a p{margin:0 0 10px}
.a p:last-child{margin-bottom:0}
.a h1,.a h2,.a h3,.a h4,.a h5,.a h6{font-weight:800;line-height:1.25;margin:18px 0 9px;color:#211b35}
.a h1{font-size:1.55em}.a h2{font-size:1.32em}.a h3{font-size:1.14em}
.a ul,.a ol{padding-left:24px;margin:8px 0 12px}
.a li{padding-left:3px;margin:5px 0}
.a blockquote{margin:10px 0;padding:10px 14px;border-left:3px solid #a63cef;background:#f1edfa;border-radius:0 12px 12px 0;color:#625a75}
.a hr{border:0;height:1px;background:#e7e2f1;margin:16px 0}
.a strong{font-weight:750;color:#211b35}
.a em{font-style:italic}
.a del{opacity:.65}
.a a{color:#7540d6;text-decoration:underline;text-underline-offset:2px}
.a pre{white-space:pre;line-height:1.5}
.a pre code{background:none;color:inherit;padding:0;border-radius:0;font-size:inherit}
.dt i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#a63cef;margin-right:5px;animation:b 1s infinite}
.dt i:nth-child(2){animation-delay:.15s}.dt i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.25;transform:scale(.7)}}
footer{padding:8px 12px calc(10px + env(safe-area-inset-bottom));text-align:center}
.cw{position:relative}
.box{background:#fff;border-radius:30px;box-shadow:0 6px 30px rgba(80,60,140,.12);padding:14px 12px 12px;text-align:left}
textarea{width:100%;border:0;outline:0;resize:none;background:none;font:inherit;font-size:17px;max-height:140px;padding:2px 10px 12px;color:inherit;display:block}
.row{display:flex;gap:8px;align-items:center}
.ib{width:38px;height:38px;border-radius:50%;background:#efedf8;display:grid;place-items:center;flex:none}
#bp.on{background:#3b6df0;color:#fff}
.model{flex:1;min-width:0;height:38px;border-radius:19px;border:1.5px solid #e6e3f2;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 16px;font-weight:700;font-size:15px}
.model b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model.open{border-color:#3b6df0}
#bd{background:#b9c8ff;color:#fff}#bd.on{background:#3b6df0}
.note{font-size:12.5px;color:#7a7690;margin-top:8px}
.pop{display:none;position:absolute;z-index:50;background:#fff;border-radius:28px;box-shadow:0 10px 40px rgba(40,30,80,.22);padding:10px}
.pop.show{display:block}
#mp{left:0;bottom:calc(100% + 8px);width:min(86%,300px)}
#mm{right:0;bottom:calc(100% + 8px);width:min(100%,360px);text-align:left}
#mo{top:66px;right:12px;width:230px}
#mu{right:8px;bottom:64px;width:220px}
.pi{display:flex;align-items:center;gap:16px;width:100%;padding:8px 10px;text-align:left;font-size:18px;font-weight:600;border-radius:16px}
.pi .ib{width:46px;height:46px}
.mi{display:block;width:100%;text-align:left;padding:12px 40px 12px 16px;position:relative}
.mi b{display:block;font-size:19px}.mi small{color:#6e6a80;font-size:15px}
.mi svg{position:absolute;right:14px;top:18px;color:#3b6df0}
#sh{display:none;position:fixed;inset:0;background:rgba(30,25,50,.35);z-index:40}
#sh.show{display:block}
#dr{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);background:#fff;z-index:60;transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column;padding:16px 14px calc(14px + env(safe-area-inset-bottom))}
#dr.open{transform:none}
.dh{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:800;padding:4px 4px 18px}.dh b{flex:1}
.dh .lg{width:40px;height:40px;border-radius:12px;box-shadow:none;margin:0}
.nc{display:flex;align-items:center;justify-content:center;gap:12px;height:52px;border-radius:26px;color:#fff;font-weight:800;font-size:19px;background:linear-gradient(90deg,#a63cef,#ff4fa0 55%,#ff8a2a);box-shadow:0 8px 24px rgba(200,60,200,.3)}
.sr{display:flex;align-items:center;gap:12px;margin:14px 0 8px;height:48px;border-radius:24px;background:#efedf8;padding:0 18px;color:#6e6a80}
.sr input{flex:1;border:0;outline:0;background:none;font:inherit;min-width:0}
#hist{flex:1;overflow:auto}
#hist h4{font-size:15px;font-weight:500;color:#7a7690;margin:18px 8px 6px}
.ci{padding:13px 14px;border-radius:16px;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci.cur{background:#efedf8}
.us{position:relative;display:flex;align-items:center;gap:14px;border-top:1px solid #ebe9f3;padding-top:14px;font-weight:800;font-size:20px}
.us b{flex:1}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#a63cef,#ff8a2a);color:#fff;display:grid;place-items:center;font-style:normal}
#tt{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#14121f;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:86vw;text-align:center}
#tt.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="rb"><button id="bm" data-i="menu"></button></div>
    <div class="rb"><button id="bn" data-i="edit"></button><button id="bo" data-i="dots"></button></div>
  </header>
  <div class="pop" id="mo"></div>
  <main id="main">
    <div id="wl"><img class="lg" alt="Quantum"><h1><span>Привет,</span> давайте начнём общение</h1></div>
    <div id="msgs"></div>
  </main>
  <footer>
    <div class="cw">
      <div class="pop" id="mp"></div>
      <div class="pop" id="mm"></div>
      <div class="box">
        <textarea id="ta" rows="1" placeholder="Спросите Quantum…"></textarea>
        <div class="row">
          <button class="ib" id="bp" data-i="plus"></button>
          <button class="model" id="bs"><b id="mn"></b><span data-i="chev"></span></button>
          <button class="ib" id="mic" data-i="mic"></button>
          <button class="ib" id="bd" data-i="up"></button>
        </div>
      </div>
    </div>
    <p class="note">Quantum может ошибаться. Проверяйте важную информацию.</p>
  </footer>
</div>
<div id="sh"></div>
<aside id="dr">
  <div class="dh"><img class="lg" alt=""><b>Quantum</b><button id="bx" data-i="x"></button></div>
  <button class="nc" id="nc"><span data-i="edit"></span>Новый чат</button>
  <label class="sr"><span data-i="search"></span><input id="sq" placeholder="Поиск по чатам"></label>
  <div id="hist"></div>
  <div class="us"><i class="av">В</i><b>Вы</b><button id="bu" data-i="dots"></button>
    <div class="pop" id="mu"><button class="pi" id="ca">Очистить все чаты</button></div></div>
</aside>
<div id="tt"></div>
<input type="file" id="fi" hidden accept=".txt,.md,.js,.json,.csv,.html,.css,.py,.log">

function inlineMD(value){
  let s=esc(value);

  s=s.replace(/`([^`\n]+)`/g,(_,c)=>hold(`<code>${c}</code>`));
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>hold(`<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`));
  s=s.replace(/\*\*(.+?)\*\*|__(.+?)__/g,(_,a,b)=>`<strong>${a||b}</strong>`);
  s=s.replace(/~~(.+?)~~/g,'<del>$1</del>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
  s=s.replace(/(^|[^_])_([^_\n]+)_(?!_)/g,'$1<em>$2</em>');

}

      continue;
    }
    if(!line.trim()){flushP();flushList();flushQ();continue}
    if(/^ {0,3}([-*_])(?:\s*\1){2,}\s*$/.test(line)){flushP();flushList();flushQ();out.push('<hr>');continue}
    const heading=line.match(/^ {0,3}#{1,6}\s+(.+?)\s*#*\s*$/);
    if(heading){flushP();flushList();flushQ();const level=Math.min(6,(line.match(/^ */)[0].length, line.match(/^ {0,3}(#+)/)[1].length));out.push(`<h${level}>${inlineMD(heading[1])}</h${level}>`);continue}
    const q=line.match(/^ {0,3}>\s?(.*)$/);
    if(q){flushP();flushList();quote.push(q[1]);continue}else flushQ();
    const ul=line.match(/^ {0,3}[-*+]\s+(.+)$/);
    const ol=line.match(/^ {0,3}\d+[.)]\s+(.+)$/);
    if(ul||ol){flushP();const type=ul?'ul':'ol';if(listType&&listType!==type)flushList();listType=type;listItems.push((ul||ol)[1]);continue}
    flushList();
    paragraph.push(line);
  }
  flushP();flushList();flushQ();
  return out.join('');
}
const toast=t=>{const e=$('#tt');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)};
const ta=$('#ta');
let chats=[],cur=null,mi=+ls.q_m||0,deep=0,busy=0;
try{
  const stored=JSON.parse(ls.q_chats||'[]');
  chats=Array.isArray(stored)?stored.filter(c=>c&&Array.isArray(c.msgs)&&c.msgs.length>0&&c.id!=null):[];
}catch(e){chats=[]}
const save=()=>{try{ls.q_chats=JSON.stringify(chats)}catch(e){}};
save();
const grp=t=>{const d=Math.round((new Date().setHours(0,0,0,0)-new Date(t).setHours(0,0,0,0))/864e5);return d<1?'Сегодня':d<2?'Вчера':d<8?'Прошлые 7 дней':'Ранее'};
function list(){const q=$('#sq').value.toLowerCase(),g={};
  chats.filter(c=>c.title.toLowerCase().includes(q)).sort((a,b)=>b.ts-a.ts).forEach(c=>(g[grp(c.ts)]=g[grp(c.ts)]||[]).push(c));
  $('#hist').innerHTML=['Сегодня','Вчера','Прошлые 7 дней','Ранее'].filter(k=>g[k]).map(k=>`<h4>${k}</h4>`+g[k].map(c=>`<div class="ci${c.id==cur?' cur':''}" data-id="${c.id}">${esc(c.title)}</div>`).join('')).join('')}
const sc=(force=true)=>{const m=$('#msgs');requestAnimationFrame(()=>{if(force)m.scrollTop=m.scrollHeight})};
function render(forceBottom=false){
  const box=$('#msgs');
  const wasNearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<90;
  const c=chats.find(x=>x.id==cur);
  $('#main').classList.toggle('has',!!(c&&c.msgs.length));
  box.innerHTML=c?c.msgs.map(m=>`<div class="m ${m.role=='user'?'u':'a'}">${m.role=='user'?esc(m.content):md(m.content)}</div>`).join(''):'';
  list();
  sc(forceBottom||wasNearBottom);
}
function mmR(){$('#mm').innerHTML=M.map((m,i)=>`<button class="mi" data-k="${i}"><b>${m[0]}</b><small>${m[1]}</small>${i==mi?ic('check'):''}</button>`).join('');$('#mn').textContent=M[mi][0]}
$('#mp').innerHTML=[['cam','Камера'],['img','Фото'],['clip','Файлы'],['at','Плагины'],['gauge','Размышлять глубже']].map(([i,t],k)=>`<button class="pi" data-k="${k}"><span class="ib">${ic(i)}</span>${t}</button>`).join('');
function close(){$$('.pop,#sh').forEach(e=>e.classList.remove('show'));$('#dr').classList.remove('open');$('#bs').classList.remove('open')}
const open=id=>{close();$('#'+id).classList.add('show');$('#sh').classList.add('show')};
$('#sh').onclick=close;$('#bx').onclick=close;
$('#bp').onclick=()=>open('mp');
$('#bs').onclick=()=>{open('mm');$('#bs').classList.add('open')};
$('#bm').onclick=()=>{close();$('#dr').classList.add('open');$('#sh').classList.add('show')};
$('#bn').onclick=$('#nc').onclick=()=>{cur=null;close();render();ta.focus()};
$('#bo').onclick=()=>{$('#mo').innerHTML='<button class="pi" id="dc">Удалить этот чат</button>';open('mo');$('#dc').onclick=()=>{chats=chats.filter(x=>x.id!=cur);cur=null;save();close();render()}};
$('#bu').onclick=()=>open('mu');
$('#ca').onclick=()=>{chats=[];cur=null;save();close();render()};
$('#hist').onclick=e=>{const c=e.target.closest('[data-id]');if(c){cur=+c.dataset.id;close();render(true)}};
$('#sq').oninput=list;
$('#mm').onclick=e=>{const b=e.target.closest('[data-k]');if(b){mi=+b.dataset.k;ls.q_m=mi;mmR();close()}};
$('#mp').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=+b.dataset.k;close();
  if(k<2)toast('Эта модель пока не умеет работать с изображениями');
  else if(k==2)$('#fi').click();
  else if(k==3)toast('Плагины скоро появятся');
  else{deep=!deep;$('#bp').classList.toggle('on',!!deep);toast(deep?'Глубокое мышление включено':'Глубокое мышление выключено')}};
$('#fi').onchange=async()=>{const f=$('#fi').files[0];if(f){ta.value+=`\n[Файл ${f.name}]\n`+(await f.text()).slice(0,12000);fit()}$('#fi').value=''};
$('#mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Голосовой ввод не поддерживается в этом браузере');const r=new R();r.lang='ru-RU';r.onresult=e=>{ta.value+=(ta.value?' ':'')+e.results[0][0].transcript;fit()};r.start()};
function fit(){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,140)+'px';$('#bd').classList.toggle('on',!!ta.value.trim())}
ta.oninput=fit;
ta.onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();send()}};
$('#bd').onclick=send;
async function send(){
  const t=ta.value.trim();if(!t||busy)return;
  let c=chats.find(x=>x.id==cur);
  if(!c){c={id:Date.now(),title:'',ts:0,msgs:[]};chats.unshift(c);cur=c.id}
  if(!c.msgs.length)c.title=t.slice(0,40);
  c.msgs.push({role:'user',content:t});c.ts=Date.now();
  ta.value='';fit();busy=1;save();render(true);
  $('#msgs').insertAdjacentHTML('beforeend','<div class="m a dt"><i></i><i></i><i></i></div>');sc(true);
  try{
    const m=c.msgs.filter(x=>!x.err).map(x=>({role:x.role,content:x.content}));
    if(deep)m[m.length-1].content+='\n\n(Подумай глубже и ответь подробно, рассуждая шаг за шагом.)';
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:m,version:['flash','genesis','infinity'][mi]})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.reply)throw new Error(String((d.error&&d.error.message)||d.error||d.message||'ответ сервера '+r.status));
    c.msgs.push({role:'assistant',content:d.reply});
  }catch(e){c.msgs.push({role:'assistant',content:'⚠️ Не удалось получить ответ ИИ: '+e.message,err:1})}
  busy=0;save();render();
}
mmR();render();
</script>
